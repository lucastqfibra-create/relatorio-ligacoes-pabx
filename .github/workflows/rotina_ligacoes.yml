name: Rotina Gravacoes PABX

on:
  schedule:
    # Executa de segunda a sexta às 07:00 BRT (10:00 UTC)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      data_consulta:
        description: 'Data no formato DD/MM/YYYY (deixe vazio para último dia útil)'
        required: false
        default: ''

jobs:
  processar-ligacoes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar Automação
        env:
          PBX_URL: ${{ secrets.PBX_URL }}
          PBX_USER: ${{ secrets.PBX_USER }}
          PBX_PASSWORD: ${{ secrets.PBX_PASSWORD }}
          DATA_MANUAL: ${{ github.event.inputs.data_consulta }}
        run: |
          python scripts/automacao_ligacoes.py

      - name: Upload dos Artefatos (Relatórios, Áudios e Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e-audios-${{ github.run_id }}
          path: ligacoes/
