name: Rotina Diária de Gravações e Transcrição

on:
  schedule:
    - cron: '0 10 * * 1-6'
  workflow_dispatch:

jobs:
  processar-ligacoes:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores Playwright
        run: |
          playwright install chromium --with-deps

      - name: Executar automação de ligações
        env:
          PBX_URL: ${{ secrets.PBX_URL }}
          PBX_USER: ${{ secrets.PBX_USER }}
          PBX_PASSWORD: ${{ secrets.PBX_PASSWORD }}
        run: |
          python scripts/automacao_ligacoes.py

      - name: Fazer upload dos áudios e relatórios (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-e-audios-${{ github.run_id }}
          path: ligacoes/**
          retention-days: 14

      - name: Salvar relatório no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ligacoes/**/*.md ligacoes/**/*.csv || true
          git commit -m "Relatório de ligações: $(date +'%Y-%m-%d')" || echo "Nenhum arquivo novo para comitar"
          git push || echo "Push ignorado"
